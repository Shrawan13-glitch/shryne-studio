name: Kotlin Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/android-native-debug.yml'

permissions:
  contents: read

concurrency:
  group: kotlin-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Assemble Kotlin Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle distribution, dependency jars and the Gradle build cache,
      # keyed automatically on the wrapper + build scripts by the official action.
      - name: Setup Gradle (distribution + dependency + build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false
          build-root-directory: native

      # Keep task outputs between runs so unchanged modules are UP-TO-DATE.
      - name: Restore project build outputs
        uses: actions/cache@v4
        with:
          path: |
            native/.gradle
            native/app/build
          key: ${{ runner.os }}-kotlin-build-${{ hashFiles('native/**/*.kt', 'native/**/*.kts', 'native/gradle.properties', 'native/gradle/wrapper/gradle-wrapper.properties', 'native/app/src/main/**') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-build-

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Assemble debug APK
        working-directory: native
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shryne-studio-debug-apk
          path: native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
